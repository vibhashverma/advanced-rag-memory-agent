services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    image: advanced-rag-agent
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside compose the app talks to the Qdrant service (allows ingestion while the API runs).
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - app_data:/app/data            # parents, children index, manifest, Mem0 memory store
      - ./data/documents:/app/data/documents   # drop PDF/TXT files here from the host

volumes:
  qdrant_data:
  app_data:
